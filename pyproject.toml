[project]
name = "django-zappa-uv"
version = "0.1.0"
description = "Template Django application deployable to AWS Lambda via Zappa, with S3-backed SQLite and uv package management"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=6.0.0,<7.0.0",
    "zappa>=0.60.0",
    "django-s3-sqlite>=0.0.5",
    "django-storages[boto3]>=1.14.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.1",
    "whitenoise>=6.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "moto[s3]>=5.0.0",
    "ruff>=0.5.0",
    "prek>=0.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    ".specify",
    ".agents",
    "migrations",
    "staticfiles",
]
