# prek configuration (fast Rust-based git hooks manager)
# See https://github.com/j178/prek for documentation

fail_fast = false
default_install_hook_types = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-yaml" },
    { id = "check-toml" },
    { id = "check-added-large-files", args = ["--maxkb=1000"] },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.9.9"
hooks = [
    # Run the linter with autofix
    { id = "ruff", args = ["--fix"] },
    # Run the formatter
    { id = "ruff-format" },
]
