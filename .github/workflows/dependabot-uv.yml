name: Dependabot & uv Dependency Updates

on:
  schedule:
    # Run weekly every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  pull_request:
    # Trigger on Dependabot PRs updating pyproject.toml
    branches: [ main ]
    paths:
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Job 1: Scheduled weekly uv lockfile upgrade and pull request creation
  weekly-uv-upgrade:
    name: Weekly uv Dependencies Upgrade
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Upgrade dependencies with uv
        run: uv lock --upgrade

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Run verification checks
        env:
          USE_S3_SQLITE: "false"
        run: |
          uv run prek run --all-files
          uv run pytest

      - name: Create Pull Request for weekly uv lock update
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update uv dependencies (weekly)"
          title: "chore(deps): update uv dependencies (weekly)"
          body: |
            Automated weekly dependency upgrade generated by `uv lock --upgrade`.

            ### Verification
            - [x] Dependencies synced with `uv sync --all-extras --dev`
            - [x] Code quality and formatting checks passed (`prek run --all-files`)
            - [x] Automated test suite passed (`pytest`)
          branch: "dependabot/uv-weekly-update"
          base: "main"
          delete-branch: true
          labels: |
            dependencies
            uv

  # Job 2: Automatically keep uv.lock in sync when Dependabot updates pyproject.toml
  sync-dependabot-pr:
    name: Sync uv.lock for Dependabot PR
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Update uv.lock
        run: uv lock

      - name: Commit updated uv.lock
        run: |
          if [ -n "$(git status --porcelain uv.lock)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore(deps): sync uv.lock with pyproject.toml"
            git push
          else
            echo "uv.lock is already up to date."
          fi
